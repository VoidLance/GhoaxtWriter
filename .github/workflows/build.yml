name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the builds to (leave empty to only upload workflow artifacts)
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Hutch (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --version 0.27.1
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Install Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Invoke-RestMethod https://hutch.blackboard.sh/hutch/install.ps1
          & ([scriptblock]::Create($script)) -Version 0.27.1
          "$HOME\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: hutch run install

      - name: Build
        run: hutch run build

      - uses: actions/upload-artifact@v4
        with:
          name: GhoaxtWriter-${{ matrix.name }}
          path: artifacts/*.*
          if-no-files-found: error

      - name: Attach to release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: find artifacts -maxdepth 1 -type f -exec gh release upload "${{ inputs.tag }}" {} --clobber \;
